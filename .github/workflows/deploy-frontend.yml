name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::783890452560:role/mdrtech-frontend-deploy
          aws-region: ca-central-1

      - name: Upload assets (long cache)
        run: |
          aws s3 sync dist s3://mdrtech.ca-frontend \
            --delete \
            --exclude "*" \
            --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload site shell (no cache)
        run: |
          aws s3 sync dist s3://mdrtech.ca-frontend \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront (HTML only)
        run: aws cloudfront create-invalidation --distribution-id E1C941D5WME836 --paths "/" "/index.html" "/robots.txt" "/sitemap.xml"